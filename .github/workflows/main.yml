name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # Фиксируем версию, где VS 2022 точно есть

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Create build directory
      run: |
        New-Item -ItemType Directory -Force -Path build
      shell: pwsh

    - name: Configure CMake
      working-directory: ./build
      run: |
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: cmd  # Используем cmd вместо pwsh для совместимости

    - name: Build project
      working-directory: ./build
      run: |
        cmake --build . --config Release -- /m
      shell: cmd

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: virus-exe
        path: build/Release/virus.exe
        retention-days: 7
        compression-level: 9

    - name: Upload debug symbols
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: pdb-files
        path: |
          build/Release/*.pdb
          build/Release/*.ilk
        retention-days: 7
        compression-level: 9

    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build/CMakeFiles/*.log
        retention-days: 3
